[project]
name = "wikipulse-backend"
version = "0.1.0"
description = "WikiPulse real-time Wikipedia monitoring backend with AI trend summaries and vandalism detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Upstream Starlette notice about its TestClient transport; not actionable in this project
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
